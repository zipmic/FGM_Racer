name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Single self-contained HTML file: download the zip from the run page,
      # unzip and double-click theme-grand-prix.html (no server needed).
      - uses: actions/upload-artifact@v4
        with:
          name: theme-grand-prix
          path: dist/theme-grand-prix.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    # Pages may only be deployed from the default branch; other branches just build.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
